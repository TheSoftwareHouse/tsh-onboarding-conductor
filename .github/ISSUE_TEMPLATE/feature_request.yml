name: Feature request
description: Propose a change or an addition
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Before proposing engine code, it is worth checking whether the declarative route already
        covers it — see [docs/EXTENDING.md](https://github.com/TheSoftwareHouse/tsh-onboarding-conductor/blob/main/docs/EXTENDING.md). Many integrations need
        no new code, only workflow configuration.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is currently awkward or impossible? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
      description: Your proposed change. A rough sketch of the workflow JSON or API shape helps if it affects either.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including whether an existing connector, field type or configuration option gets you close enough.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked whether an accepted decision record already settles this ([docs/decisions](https://github.com/TheSoftwareHouse/tsh-onboarding-conductor/blob/main/docs/decisions/README.md))
        - label: I would be willing to work on this
