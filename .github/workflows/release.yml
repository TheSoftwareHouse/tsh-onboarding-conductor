name: Version bump

# Every merge into main is released: `scripts/release.cjs` works out the next version from the
# squash-merge subjects since the last `v*` tag, writes it into every version file, prepends the
# CHANGELOG entry, commits `chore(release): v<x> [skip ci]` and tags `v<x>`. The script never
# pushes; the last step of this workflow does.
#
# The release commit cannot loop back into this workflow or CI: a push made with the workflow's
# own GITHUB_TOKEN triggers no workflow run at all. The `[skip ci]` suffix and the job's `if:`
# guard are belt and braces for the day the push moves to another token.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# One version bump at a time, and never cancelled: a cancelled run could leave a tag created locally
# but never pushed. Each run checks out main by branch, not the triggering SHA, so a run that starts
# after two quick merges releases both in one version and the run queued behind it is a no-op,
# instead of the second run trying to release an older commit on top of the first one's release.
concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version-bump:
    # Expression only. The commit message is a PR title, i.e. untrusted text: it may be compared in
    # an expression like this one, but must never be interpolated into a `run:` script.
    if: >-
      ${{ !(startsWith(github.event.head_commit.message, 'chore(release): v')
      && contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest

    env:
      # The script commits; no hooks are installed (there is no `pnpm install`), but make sure.
      HUSKY: 0

    steps:
      # Full history and every tag: the script finds the newest `v*` tag reachable from HEAD and
      # reads the commits since it.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      # The release script uses Node built-ins only, so no pnpm and no dependency install.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: node scripts/release.cjs

      # The script ends in one of three states, and only what it created is pushed:
      #   - release: a new commit and a new tag  -> push both, atomically;
      #   - baseline (version set by hand, or the first run): a new tag, no commit -> push the tag;
      #   - no-op: nothing new -> push nothing and succeed.
      # The tag is named explicitly because release tags are lightweight, which `--follow-tags`
      # does not send. The branch is pushed only when HEAD moved: pushing an unchanged HEAD would be
      # rejected as non-fast-forward whenever main gained a commit after this checkout.
      - name: Push release commit and tag
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="refs/tags/v${version}"
          refs=()
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse refs/remotes/origin/main)" ]; then
            refs+=("HEAD:refs/heads/main")
          fi
          if git rev-parse -q --verify "${tag}" >/dev/null \
            && ! git ls-remote --exit-code --tags origin "${tag}" >/dev/null; then
            refs+=("${tag}")
          fi
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "Nothing to push: v${version} is already on origin."
            exit 0
          fi
          git push --atomic origin "${refs[@]}"
