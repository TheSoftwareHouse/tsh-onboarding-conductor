name: Skill evals

# The golden-set evaluation of the skills under `.claude/skills/`. Every case runs headless Claude
# Code against a throwaway copy of this repository and grades the result with the repository's own
# oracles and a Claude judge, so a run spends real money and is not deterministic. That is why it is
# its own workflow rather than a step of ci.yml: it runs when a skill or this tooling changes, on
# demand, and weekly — never as a required check on an unrelated pull request.
#
# Secrets: ANTHROPIC_API_KEY, which both the agent (the `claude` CLI) and the judge read. Nothing
# else is needed. The agent runs on Haiku 4.5 unless a golden set or a case declares a model — the
# BFF set and one workflow case declare Sonnet, because Haiku failed them even with the skill loaded
# — and the judge is Haiku 4.5; both can be changed per run below.
on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - 'packages/skill-evals/**'
      - 'scripts/skill-eval-runner.cjs'
      - 'scripts/validate-skills.cjs'
      - '.github/workflows/skill-evals.yml'
  schedule:
    # Mondays 06:00 UTC, so a skill that drifted during the week is caught before it is relied on.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      runs:
        description: 'Runs per case (three tells a coin flip from a real gap)'
        required: false
        default: '1'
      model:
        description: 'Agent model for cases that declare none: haiku, sonnet, opus, or a full model id'
        required: false
        default: 'haiku'
      override_model:
        description: 'Agent model for every case, ignoring what the golden sets declare (empty to respect them)'
        required: false
        default: ''
      judge_model:
        description: 'Judge model'
        required: false
        default: 'haiku'
      case:
        description: 'Only cases whose id contains this text (empty for all)'
        required: false
        default: ''

# One in-flight run per pull request; a fixup supersedes the previous run rather than paying twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The agent under test runs `pnpm workflow:validate`, which reads `.env` for the users scope
      # the same way the engine does, and a missing `.env` is a failure that has nothing to do with
      # the skill. The oracle build (`@tsh/ddl-schema`) happens inside the command itself.
      - name: Create .env from the sample
        run: cp .env.dist .env

      # The system under test. The version is printed by the run itself, so a change in the harness
      # shows up in the report next to the result it produced.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the golden sets
        run: pnpm skills:evals --validate

      # The job's files do not outlive it, so the report is read from the run itself: a failed case
      # prints its reasons in the log as it finishes, `--print-report` ends the log with the whole
      # Markdown report, and the same Markdown is written to the step summary after every finished
      # case — so a run that is cancelled or hits the job timeout still shows a partial one.
      - name: Run the golden sets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKILL_EVALS_AGENT_MODEL: ${{ inputs.model || 'haiku' }}
          SKILL_EVALS_JUDGE_MODEL: ${{ inputs.judge_model || 'haiku' }}
        run: >
          pnpm skills:evals
          --runs ${{ inputs.runs || '1' }}
          --report-dir packages/skill-evals/reports/ci
          --print-report
          ${{ inputs.case != '' && format('--case {0}', inputs.case) || '' }}
          ${{ inputs.override_model != '' && format('--override-model {0}', inputs.override_model) || '' }}

      # `report.json` carries what the Markdown shortens — every tool call and the whole final
      # message of every run — for comparing runs or reading one closely; the verdict itself needs
      # no download. Rewritten after every finished case, so a cancelled or timed-out run still
      # uploads a partial one, marked as such.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-evals-report-${{ github.run_id }}
          path: packages/skill-evals/reports/ci/
          retention-days: 30
          if-no-files-found: ignore
