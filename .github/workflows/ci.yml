name: CI

# Push is restricted to main on purpose. Listening on both push:'**' and
# pull_request:'**' ran the whole pipeline twice for every same-repo PR branch:
# the branch push fired one run and the PR fired a second, identical one. Since
# nothing reaches main except through a PR, the pull_request trigger already
# covers every branch that matters, and push:main covers the post-merge commit.
# Use workflow_dispatch to verify a branch that has no PR open yet.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

# One in-flight run per PR (or per main commit). Pushing a fixup to an open PR
# supersedes the previous run instead of queueing a second full pipeline behind
# it. Never cancel on main: every commit that lands there gets a complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orchestrator
          POSTGRES_USER: orchestrator
          POSTGRES_PASSWORD: orchestrator_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orchestrator -d orchestrator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # MinIO cannot be declared here: GitHub Actions service containers cannot
      # override an image command, and minio/minio's default CMD only prints
      # help and exits. It is started as a plain docker container in the
      # "Start MinIO" step below instead, and torn down in "Stop MinIO".
      # Do NOT use the Bitnami image (bitnamilegacy is archived/frozen).

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data --console-address ":9001"

      - name: Create MinIO bucket
        timeout-minutes: 2
        run: docker run --rm --network container:minio --entrypoint /bin/sh minio/mc:latest -c 'i=0; until mc alias set local http://127.0.0.1:9000 minioadmin minioadmin >/dev/null 2>&1 || [ "$i" -ge 30 ]; do i=$((i+1)); sleep 2; done; mc mb --ignore-existing local/orchestrator-files'

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ConfigModule reads .env only; .env.dist is the sample, not a fallback. This is the same
      # first step the README gives developers.
      - name: Create .env from the sample
        run: cp .env.dist .env

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:cov

      - name: Install Playwright browsers
        run: |
          pnpm --filter @tsh/demo-web exec playwright install --with-deps chromium
          pnpm --filter @tsh/admin-panel exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e:ci

      # The Compose stack this step starts includes `postgres`, because
      # `engine-mailhog-test` resolves the SMTP connector's settings through the real
      # `connector_settings` table. Compose publishes that container on
      # `${POSTGRES_PORT:-5432}`, and `.env` (copied from `.env.dist` above) leaves it at
      # 5432 — already bound by the `postgres` service container declared for this job, so
      # Docker fails the run with "port is already allocated". Remap the host side to a free
      # port; nothing here connects over it, the runner talks to `postgres:5432` inside the
      # Compose network. Any further host-published service added to `engine-mailhog-test`'s
      # dependencies (Redis on 6379, MinIO on 9000/9001) needs the same treatment.
      - name: MailHog SMTP integration test
        env:
          POSTGRES_PORT: 55432
        run: pnpm test:mailhog:integration

      - name: Stop MinIO
        if: always()
        run: docker rm -f minio || true
