name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orchestrator
          POSTGRES_USER: orchestrator
          POSTGRES_PASSWORD: orchestrator_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orchestrator -d orchestrator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # MinIO cannot be declared here: GitHub Actions service containers cannot
      # override an image command, and minio/minio's default CMD only prints
      # help and exits. It is started as a plain docker container in the
      # "Start MinIO" step below instead, and torn down in "Stop MinIO".
      # Do NOT use the Bitnami image (bitnamilegacy is archived/frozen).

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data --console-address ":9001"

      - name: Create MinIO bucket
        timeout-minutes: 2
        run: docker run --rm --network container:minio --entrypoint /bin/sh minio/mc:latest -c 'i=0; until mc alias set local http://127.0.0.1:9000 minioadmin minioadmin >/dev/null 2>&1 || [ "$i" -ge 30 ]; do i=$((i+1)); sleep 2; done; mc mb --ignore-existing local/orchestrator-files'

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:cov

      - name: Install Playwright browsers
        run: pnpm --filter @tsh/demo-web exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e:ci

      - name: Stop MinIO
        if: always()
        run: docker rm -f minio || true
