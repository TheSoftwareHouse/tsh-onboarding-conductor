name: CI

# Push is restricted to main on purpose. Listening on both push:'**' and
# pull_request:'**' ran the whole pipeline twice for every same-repo PR branch:
# the branch push fired one run and the PR fired a second, identical one. Since
# nothing reaches main except through a PR, the pull_request trigger already
# covers every branch that matters, and push:main covers the post-merge commit.
# Use workflow_dispatch to verify a branch that has no PR open yet.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

# One in-flight run per PR (or per main commit). Pushing a fixup to an open PR
# supersedes the previous run instead of queueing a second full pipeline behind
# it. Never cancel on main: every commit that lands there gets a complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orchestrator
          POSTGRES_USER: orchestrator
          POSTGRES_PASSWORD: orchestrator_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orchestrator -d orchestrator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Garage cannot be declared here: GitHub Actions service containers have no way to
      # supply a command, and dxflrs/garage:v2.4.1 has no entrypoint — it only runs the
      # server when invoked explicitly as `/garage server --single-node --default-bucket`.
      # It is started as a plain docker container in the "Start Garage" step below instead,
      # and torn down in "Stop Garage".
      # Do NOT swap in a Bitnami image for this service — bitnamilegacy is archived/frozen.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Garage
        run: |
          docker run -d --name garage \
            -p 3900:3900 \
            -v "$(pwd)/docker/garage.toml:/etc/garage.toml:ro" \
            -e GARAGE_DEFAULT_BUCKET=orchestrator-files \
            -e GARAGE_DEFAULT_ACCESS_KEY=onboardingdev \
            -e GARAGE_DEFAULT_SECRET_KEY=onboardingdevsecret0123456789 \
            dxflrs/garage:v2.4.1 /garage server --single-node --default-bucket

      # No bucket-creation step: `--single-node --default-bucket` makes the server create the
      # layout, access key and bucket itself from the GARAGE_DEFAULT_* env vars above. This just
      # waits for that boot to finish, polling from the runner since the image has no shell to
      # poll from inside. `garage status` only proves the RPC listener is up, not that the
      # bucket/key/grant bootstrap has finished, so poll for the bucket the suites actually use.
      - name: Wait for Garage
        timeout-minutes: 2
        run: |
          i=0
          until docker exec garage /garage bucket info orchestrator-files >/dev/null 2>&1 || [ "$i" -ge 30 ]; do
            i=$((i+1))
            sleep 2
          done
          docker exec garage /garage bucket info orchestrator-files

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ConfigModule reads .env only; .env.dist is the sample, not a fallback. This is the same
      # first step the README gives developers.
      - name: Create .env from the sample
        run: cp .env.dist .env

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:cov

      - name: Install Playwright browsers
        run: |
          pnpm --filter @tsh/demo-web exec playwright install --with-deps chromium
          pnpm --filter @tsh/admin-panel exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e:ci

      # The Compose stack this step starts includes `postgres`, because
      # `engine-mailhog-test` resolves the SMTP connector's settings through the real
      # `connectors` table. Compose publishes that container on
      # `${POSTGRES_PORT:-5432}`, and `.env` (copied from `.env.dist` above) leaves it at
      # 5432 — already bound by the `postgres` service container declared for this job, so
      # Docker fails the run with "port is already allocated". Remap the host side to a free
      # port; nothing here connects over it, the runner talks to `postgres:5432` inside the
      # Compose network. Any further host-published service added to `engine-mailhog-test`'s
      # dependencies (Redis on 6379, Garage on 3900) needs the same treatment.
      - name: MailHog SMTP integration test
        env:
          POSTGRES_PORT: 55432
        run: pnpm test:mailhog:integration

      - name: Stop Garage
        if: always()
        run: docker rm -f garage || true
