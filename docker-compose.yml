name: tsh-onboarding-conductor

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator_pass
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # S3-compatible object store. No entrypoint in the image: the command must be
  # `/garage server`. `--single-node --default-bucket` makes the server bootstrap its own
  # layout, access key and bucket from the GARAGE_DEFAULT_* env vars on first boot, and is a
  # no-op on later boots once they already exist — there is no separate init container (see
  # docs/decisions/0014-garage-as-the-local-object-store.md).
  garage:
    image: dxflrs/garage:v2.4.1
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_DEFAULT_BUCKET: orchestrator-files
      GARAGE_DEFAULT_ACCESS_KEY: onboardingdev
      GARAGE_DEFAULT_SECRET_KEY: onboardingdevsecret0123456789
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - '${STORAGE_S3_PORT:-3900}:3900'
    healthcheck:
      # No curl/wget guaranteed in the image; `/garage status` needs neither and succeeds
      # once the node is up.
      test: ['CMD', '/garage', 'status']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # In-memory, local/dev/CI-only SMTP sink. SMTP (1025) is Compose-network-only;
  # only the HTTP inspection UI/API (8025) is published to the host.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64 # no arm64 image published; explicit emulation silences the Apple Silicon warning
    ports:
      - '${MAILHOG_HTTP_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:8025/']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  engine:
    image: tsh-onboarding-conductor-engine:local
    build:
      context: .
      dockerfile: packages/engine/Dockerfile
    environment:
      # Demanded from .env: Compose itself refuses to start an engine that does not know its environment.
      NODE_ENV: ${NODE_ENV:?NODE_ENV must be set in .env (development, production or test)}
      ENVIRONMENT_NAME: ${ENVIRONMENT_NAME:?ENVIRONMENT_NAME must be set in .env (e.g. dev, staging, prod)}
      # Compose pins the API role to an API-capable mode; direct (non-Compose) engine
      # starts still follow MODE from .env per .env.dist.
      MODE: api-only
      PORT: ${PORT:-3000}
      ADMIN_PANEL_ORIGIN: ${ADMIN_PANEL_ORIGIN:-http://localhost:5173}
      # The admin panel's own settings, read at container start like every other engine value, so a
      # .env change takes effect on restart with no image rebuild. The engine renders them into the
      # /config.js the panel loads. VITE_ENGINE_API_BASE_URL is deliberately not listed: unset means
      # "call the origin the panel was served from", which is this container whatever ENGINE_PORT
      # publishes it on.
      VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-false}
      VITE_SSO_PROVIDER: ${VITE_SSO_PROVIDER:-azure}
      VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID:-}
      VITE_AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID:-}
      VITE_AZURE_API_SCOPE: ${VITE_AZURE_API_SCOPE:-}
      VITE_AZURE_REDIRECT_URI: ${VITE_AZURE_REDIRECT_URI:-}
      # Entra ID verification on the admin read endpoints. Defaults to on, matching the engine's
      # own default, so the container refuses to start unconfigured rather than serving admin
      # data unguarded; .env.dist ships the flag as false for a fresh clone.
      ADMIN_AUTH_ENABLED: ${ADMIN_AUTH_ENABLED:-true}
      # Which provider issues those tokens; 'azure' is the only one implemented.
      ADMIN_SSO_PROVIDER: ${ADMIN_SSO_PROVIDER:-azure}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_API_AUDIENCE: ${AZURE_API_AUDIENCE:-}
      ADMIN_REQUIRED_ROLES: ${ADMIN_REQUIRED_ROLES:-admin}
      DATABASE_URL: postgres://orchestrator:orchestrator_pass@postgres:5432/orchestrator?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # The key-encryption key, forwarded from `.env`; unset means this process cannot turn
      # encryption on, which is the shipped default. Both engine services must hold the same value.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # The key ring's background refresh and the sweep's poll interval/batch size. Forwarded to
      # both engine services: the sweep runs on the worker, but the ring refresh keeps this
      # container's own reads and writes current with a change made from the admin panel.
      ENCRYPTION_KEY_RING_REFRESH_INTERVAL_MS: ${ENCRYPTION_KEY_RING_REFRESH_INTERVAL_MS:-15000}
      ENCRYPTION_SWEEP_POLL_INTERVAL_MS: ${ENCRYPTION_SWEEP_POLL_INTERVAL_MS:-5000}
      ENCRYPTION_SWEEP_BATCH_SIZE: ${ENCRYPTION_SWEEP_BATCH_SIZE:-100}
      # How often the engine checks whether the key's stored rotation schedule has come due; the
      # schedule itself is chosen per key from the admin panel, never from here.
      ENCRYPTION_KEY_ROTATION_CHECK_INTERVAL_MS: ${ENCRYPTION_KEY_ROTATION_CHECK_INTERVAL_MS:-60000}
      STORAGE_DRIVER: s3
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-orchestrator-files}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ENDPOINT: http://garage:3900
      STORAGE_S3_FORCE_PATH_STYLE: 'true'
      STORAGE_S3_ACCESS_KEY_ID: onboardingdev
      STORAGE_S3_SECRET_ACCESS_KEY: onboardingdevsecret0123456789
      TWILIO_VERIFY_TIMEOUT_MS: ${TWILIO_VERIFY_TIMEOUT_MS:-10000}
      WORKFLOWS_USERS_DIR: /app/workflows/users
      EMAIL_TEMPLATES_USERS_DIR: /app/email-templates/users
      WEBHOOK_OUTBOX_QUEUE_NAME: ${WEBHOOK_OUTBOX_QUEUE_NAME:-webhook-outbox}
      WEBHOOK_OUTBOX_QUEUE_CONCURRENCY: ${WEBHOOK_OUTBOX_QUEUE_CONCURRENCY:-4}
      HTTP_CONNECTOR_TIMEOUT_MS: ${HTTP_CONNECTOR_TIMEOUT_MS:-5000}
      HTTP_CONNECTOR_SECRETS: ${HTTP_CONNECTOR_SECRETS:-{}}
      CONNECTOR_CALLBACK_UNSIGNED_TYPES: ${CONNECTOR_CALLBACK_UNSIGNED_TYPES:-}
      # Local/dev/CI-only MailHog sink. The SMTP connector itself is provider-agnostic;
      # unencrypted delivery is what needs the explicit SMTP_ALLOW_INSECURE opt-in.
      SMTP_ENABLED: 'true'
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_STARTTLS: 'false'
      SMTP_ALLOW_INSECURE: 'true'
      SMTP_FROM: sender@example.com
      SMTP_TIMEOUT_MS: 5000
    ports:
      # Serves both halves: the API under /v1 and the admin panel at every other path.
      - '${ENGINE_PORT:-3000}:3000'
    volumes:
      # built-in/ and fixtures/ workflows and templates ship inside the image;
      # only the users/ scopes are host-mounted so they can be replaced.
      - ${WORKFLOWS_USERS_DIR:-./workflows/users}:/app/workflows/users:ro
      - ${EMAIL_TEMPLATES_USERS_DIR:-./email-templates/users}:/app/email-templates/users:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3000/v1/health/live >/dev/null']
      # `start_interval` probes every 2s until the first success, so a normal boot (~3s) reports
      # healthy almost at once and `engine-worker` is not held behind a 10s tick. `start_period`
      # then buys a cold, CPU-contended boot real headroom before a failure counts: probes that
      # fail inside it are free, and the engine has no work to do after the port is open, so a
      # long grace window costs a genuinely broken container only the time to exhaust `retries`.
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
      start_interval: 2s

  engine-worker:
    # Reuses the engine image built above; no separate build definition.
    image: tsh-onboarding-conductor-engine:local
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV must be set in .env (development, production or test)}
      ENVIRONMENT_NAME: ${ENVIRONMENT_NAME:?ENVIRONMENT_NAME must be set in .env (e.g. dev, staging, prod)}
      MODE: worker-only
      ADMIN_PANEL_ORIGIN: ${ADMIN_PANEL_ORIGIN:-http://localhost:5173}
      # The worker serves no HTTP admin routes, but shares the engine's configuration
      # validation, so it needs the same values to start.
      ADMIN_AUTH_ENABLED: ${ADMIN_AUTH_ENABLED:-true}
      # Which provider issues those tokens; 'azure' is the only one implemented.
      ADMIN_SSO_PROVIDER: ${ADMIN_SSO_PROVIDER:-azure}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_API_AUDIENCE: ${AZURE_API_AUDIENCE:-}
      ADMIN_REQUIRED_ROLES: ${ADMIN_REQUIRED_ROLES:-admin}
      DATABASE_URL: postgres://orchestrator:orchestrator_pass@postgres:5432/orchestrator?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # The key-encryption key, forwarded from `.env`; unset means this process cannot turn
      # encryption on, which is the shipped default. Both engine services must hold the same value.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # The key ring's background refresh and the sweep's poll interval/batch size. Forwarded to
      # both engine services: the sweep runs on the worker, but the ring refresh keeps this
      # container's own reads and writes current with a change made from the admin panel.
      ENCRYPTION_KEY_RING_REFRESH_INTERVAL_MS: ${ENCRYPTION_KEY_RING_REFRESH_INTERVAL_MS:-15000}
      ENCRYPTION_SWEEP_POLL_INTERVAL_MS: ${ENCRYPTION_SWEEP_POLL_INTERVAL_MS:-5000}
      ENCRYPTION_SWEEP_BATCH_SIZE: ${ENCRYPTION_SWEEP_BATCH_SIZE:-100}
      # How often the engine checks whether the key's stored rotation schedule has come due; the
      # schedule itself is chosen per key from the admin panel, never from here.
      ENCRYPTION_KEY_ROTATION_CHECK_INTERVAL_MS: ${ENCRYPTION_KEY_ROTATION_CHECK_INTERVAL_MS:-60000}
      STORAGE_DRIVER: s3
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-orchestrator-files}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ENDPOINT: http://garage:3900
      STORAGE_S3_FORCE_PATH_STYLE: 'true'
      STORAGE_S3_ACCESS_KEY_ID: onboardingdev
      STORAGE_S3_SECRET_ACCESS_KEY: onboardingdevsecret0123456789
      WORKFLOWS_USERS_DIR: /app/workflows/users
      EMAIL_TEMPLATES_USERS_DIR: /app/email-templates/users
      WEBHOOK_OUTBOX_QUEUE_NAME: ${WEBHOOK_OUTBOX_QUEUE_NAME:-webhook-outbox}
      WEBHOOK_OUTBOX_QUEUE_CONCURRENCY: ${WEBHOOK_OUTBOX_QUEUE_CONCURRENCY:-4}
      HTTP_CONNECTOR_TIMEOUT_MS: ${HTTP_CONNECTOR_TIMEOUT_MS:-5000}
      HTTP_CONNECTOR_SECRETS: ${HTTP_CONNECTOR_SECRETS:-{}}
      CONNECTOR_CALLBACK_UNSIGNED_TYPES: ${CONNECTOR_CALLBACK_UNSIGNED_TYPES:-}
      WEBHOOK_OUTBOX_WORKER_POLL_INTERVAL_MS: ${WEBHOOK_OUTBOX_WORKER_POLL_INTERVAL_MS:-1000}
      WEBHOOK_OUTBOX_WORKER_BATCH_SIZE: ${WEBHOOK_OUTBOX_WORKER_BATCH_SIZE:-25}
      WEBHOOK_OUTBOX_WORKER_LEASE_MS: ${WEBHOOK_OUTBOX_WORKER_LEASE_MS:-60000}
      # Local/dev/CI-only MailHog sink. The SMTP connector itself is provider-agnostic;
      # unencrypted delivery is what needs the explicit SMTP_ALLOW_INSECURE opt-in.
      SMTP_ENABLED: 'true'
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_STARTTLS: 'false'
      SMTP_ALLOW_INSECURE: 'true'
      SMTP_FROM: sender@example.com
      SMTP_TIMEOUT_MS: 5000
    volumes:
      # built-in/ and fixtures/ workflows and templates ship inside the image;
      # only the users/ scopes are host-mounted so they can be replaced.
      - ${WORKFLOWS_USERS_DIR:-./workflows/users}:/app/workflows/users:ro
      - ${EMAIL_TEMPLATES_USERS_DIR:-./email-templates/users}:/app/email-templates/users:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
      mailhog:
        condition: service_healthy
      engine:
        condition: service_healthy

  # Short-lived internal test runner for the SMTP connector integration spec against MailHog
  # (added in a follow-up task); never publishes SMTP and has no volumes. Joins `postgres` too,
  # not just `mailhog`: the spec resolves its credentials through the real
  # `ConnectorSettingsService` against the real `connector_settings` table, rather than a stub.
  #
  # Behind a profile, so no unscoped `up` — `pnpm stack:up` above all — starts it. Without the
  # profile it ran as an ordinary service alongside the dev stack, where it does three things it
  # has no business doing to a dev database and a booting engine: it applies migrations
  # (`migrationsRun: true` in the spec's own DataSource) against the same `orchestrator` database
  # the engine is migrating, it deletes the `smtp` row from `connectors`, and its jest run holds a
  # whole core plus ~900 MB while `engine` boots — enough on a 2-vCPU VM to push that boot past
  # the healthcheck budget below, which fails `engine-worker`'s `service_healthy` dependency and
  # so the whole `up`. `scripts/test-mailhog-integration.cjs` enables the profile explicitly.
  engine-mailhog-test:
    profiles: ['mailhog-test']
    image: tsh-onboarding-conductor-engine:local
    build:
      context: .
      dockerfile: packages/engine/Dockerfile
    environment:
      NODE_ENV: test
      JEST_E2E_SPEC: smtp.e2e-spec.ts
      SMTP_ENABLED: 'true'
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_STARTTLS: 'false'
      SMTP_ALLOW_INSECURE: 'true'
      SMTP_FROM: sender@example.com
      SMTP_TIMEOUT_MS: 5000
    command:
      [
        'node',
        '--experimental-vm-modules',
        './node_modules/jest/bin/jest.js',
        '--config',
        './test/jest-e2e.config.cjs',
        '--runInBand',
        '--testPathPattern',
        'smtp.e2e-spec',
      ]
    depends_on:
      mailhog:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  garage-meta:
  garage-data:
