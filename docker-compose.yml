name: tsh-onboarding-conductor

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator_pass
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '${STORAGE_S3_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      STORAGE_S3_BUCKET: orchestrator-files
    entrypoint:
      [
        'sh',
        '-ec',
        'until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done && mc mb --ignore-existing local/$$STORAGE_S3_BUCKET',
      ]

  # In-memory, local/dev/CI-only SMTP sink. SMTP (1025) is Compose-network-only;
  # only the HTTP inspection UI/API (8025) is published to the host.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - '${MAILHOG_HTTP_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:8025/']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  engine:
    image: tsh-onboarding-conductor-engine:local
    build:
      context: .
      dockerfile: packages/engine/Dockerfile
    environment:
      NODE_ENV: development
      # Compose pins the API role to an API-capable mode; direct (non-Compose) engine
      # starts still follow MODE from .env per .env.dist.
      MODE: api-only
      PORT: ${PORT:-3000}
      ADMIN_PANEL_ORIGIN: ${ADMIN_PANEL_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgres://orchestrator:orchestrator_pass@postgres:5432/orchestrator?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      STORAGE_DRIVER: s3
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-orchestrator-files}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_FORCE_PATH_STYLE: 'true'
      STORAGE_S3_ACCESS_KEY_ID: minioadmin
      STORAGE_S3_SECRET_ACCESS_KEY: minioadmin
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID}
      TWILIO_VERIFY_TIMEOUT_MS: ${TWILIO_VERIFY_TIMEOUT_MS:-10000}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM: ${SENDGRID_FROM}
      WORKFLOWS_DIR: /app/workflows
      WEBHOOK_OUTBOX_QUEUE_NAME: ${WEBHOOK_OUTBOX_QUEUE_NAME:-webhook-outbox}
      WEBHOOK_OUTBOX_QUEUE_CONCURRENCY: ${WEBHOOK_OUTBOX_QUEUE_CONCURRENCY:-4}
      HTTP_CONNECTOR_TIMEOUT_MS: ${HTTP_CONNECTOR_TIMEOUT_MS:-5000}
      HTTP_CONNECTOR_SECRETS: ${HTTP_CONNECTOR_SECRETS:-{}}
      # Local/dev/CI-only MailHog sink; plaintext is only permitted for SMTP_HOST=mailhog.
      SMTP_ENABLED: 'true'
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_STARTTLS: 'false'
      SMTP_FROM: sender@example.com
      SMTP_TIMEOUT_MS: 5000
    ports:
      - '${ENGINE_PORT:-3000}:3000'
    volumes:
      - ./examples/workflows:/app/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailhog:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3000/v1/health/live >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  engine-worker:
    # Reuses the engine image built above; no separate build definition.
    image: tsh-onboarding-conductor-engine:local
    environment:
      NODE_ENV: development
      MODE: worker-only
      ADMIN_PANEL_ORIGIN: ${ADMIN_PANEL_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgres://orchestrator:orchestrator_pass@postgres:5432/orchestrator?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      STORAGE_DRIVER: s3
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-orchestrator-files}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_FORCE_PATH_STYLE: 'true'
      STORAGE_S3_ACCESS_KEY_ID: minioadmin
      STORAGE_S3_SECRET_ACCESS_KEY: minioadmin
      WORKFLOWS_DIR: /app/workflows
      WEBHOOK_OUTBOX_QUEUE_NAME: ${WEBHOOK_OUTBOX_QUEUE_NAME:-webhook-outbox}
      WEBHOOK_OUTBOX_QUEUE_CONCURRENCY: ${WEBHOOK_OUTBOX_QUEUE_CONCURRENCY:-4}
      HTTP_CONNECTOR_TIMEOUT_MS: ${HTTP_CONNECTOR_TIMEOUT_MS:-5000}
      HTTP_CONNECTOR_SECRETS: ${HTTP_CONNECTOR_SECRETS:-{}}
      WEBHOOK_OUTBOX_WORKER_POLL_INTERVAL_MS: ${WEBHOOK_OUTBOX_WORKER_POLL_INTERVAL_MS:-1000}
      WEBHOOK_OUTBOX_WORKER_BATCH_SIZE: ${WEBHOOK_OUTBOX_WORKER_BATCH_SIZE:-25}
      WEBHOOK_OUTBOX_WORKER_LEASE_MS: ${WEBHOOK_OUTBOX_WORKER_LEASE_MS:-60000}
      # Local/dev/CI-only MailHog sink; plaintext is only permitted for SMTP_HOST=mailhog.
      SMTP_ENABLED: 'true'
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_STARTTLS: 'false'
      SMTP_FROM: sender@example.com
      SMTP_TIMEOUT_MS: 5000
    volumes:
      - ./examples/workflows:/app/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailhog:
        condition: service_healthy
      engine:
        condition: service_healthy

  # Short-lived internal test runner for the SMTP-to-MailHog integration spec
  # (added in a follow-up task); never publishes SMTP and has no volumes.
  engine-mailhog-test:
    image: tsh-onboarding-conductor-engine:local
    build:
      context: .
      dockerfile: packages/engine/Dockerfile
    environment:
      NODE_ENV: test
      JEST_E2E_SPEC: smtp-mailhog.e2e-spec.ts
      SMTP_ENABLED: 'true'
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_STARTTLS: 'false'
      SMTP_FROM: sender@example.com
      SMTP_TIMEOUT_MS: 5000
    command:
      [
        'node',
        '--experimental-vm-modules',
        './node_modules/jest/bin/jest.js',
        '--config',
        './test/jest-e2e.config.cjs',
        '--runInBand',
        '--testPathPattern',
        'smtp-mailhog',
      ]
    depends_on:
      mailhog:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
