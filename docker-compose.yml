name: tsh-onboarding-conductor

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      STORAGE_S3_BUCKET: orchestrator-files
    entrypoint:
      [
        'sh',
        '-ec',
        'until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done && mc mb --ignore-existing local/$$STORAGE_S3_BUCKET',
      ]

  engine:
    build:
      context: .
      dockerfile: packages/engine/Dockerfile
    environment:
      NODE_ENV: development
      MODE: ${MODE:-all}
      PORT: ${PORT:-3000}
      ENGINE_SERVICE_SECRET: ${ENGINE_SERVICE_SECRET:-change-me}
      DATABASE_URL: postgres://orchestrator:orchestrator_pass@postgres:5432/orchestrator?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      STORAGE_DRIVER: s3
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-orchestrator-files}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_FORCE_PATH_STYLE: 'true'
      STORAGE_S3_ACCESS_KEY_ID: minioadmin
      STORAGE_S3_SECRET_ACCESS_KEY: minioadmin
      WORKFLOWS_DIR: /app/workflows
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - ./workflows:/app/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3000/v1/health/live >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  demo-bff:
    build:
      context: .
      dockerfile: packages/demo-bff/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      ENGINE_BASE_URL: http://engine:3000
      ENGINE_SERVICE_SECRET: ${ENGINE_SERVICE_SECRET:-change-me}
      DEMO_WORKFLOW_ID: ${DEMO_WORKFLOW_ID:-base}
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3001/v1/health/live >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  demo-web:
    build:
      context: .
      dockerfile: packages/demo-web/Dockerfile
      args:
        VITE_BFF_BASE_URL: http://localhost:3001
    environment:
      VITE_BFF_BASE_URL: http://localhost:3001
    ports:
      - '127.0.0.1:5173:5173'
    depends_on:
      demo-bff:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:5173/ >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  minio-data:
