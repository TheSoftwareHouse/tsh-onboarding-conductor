server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # config.js is rewritten at container start from the environment; never cache it.
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  # Fingerprinted build output.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes (/s/<token>/...) all resolve to the SPA entry point.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
