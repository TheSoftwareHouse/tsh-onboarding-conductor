# Site config for the admin panel's static production build. Listens on the unprivileged
# port 8080 (see packages/admin-panel/Dockerfile's runtime stage) and serves an SPA: any
# path that is not a real file falls back to /index.html so a hard refresh on a client-side
# route (e.g. /audit) still resolves. /config.js is exempt from caching so a container
# restart's new runtime values are never masked by a browser's cached copy. index.html is
# forced to revalidate on every request too — without it, a browser may reuse a heuristically
# cached copy after a rebuild changes the hashed asset filenames it references, and the SPA
# fallback would serve that stale index.html (HTTP 200) for the missing asset instead of
# surfacing the mismatch. The hashed assets under /assets/ are unaffected and stay cacheable.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files /config.js =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
